<!DOCTYPE html>
<html lang="en">

<head>
  <title>Page not found</title>
  <script type="text/javascript">
    // Home + bare-state redirects (client-side fallback). Two related 404s are
    // rescued here, both ideally handled by published redirects-sheet rules but
    // covered here for hosts/paths the server rule doesn't reach. Runs before
    // the 404 UI renders to avoid a flash. Keep STATES in sync with
    // scripts/constants.js SITE_STATES.
    (function () {
      var STATES = ['co', 'mi', 'mn', 'nm', 'nd', 'sd', 'tx', 'wi'];
      var p = window.location.pathname;

      // 1) Site root: there is no root home page — all content lives under
      //    /{state}/... A server-level 301 sends the root to
      //    /state-selector?from=home. A returning visitor with a saved state is
      //    forwarded straight to their state home (something the server rule
      //    can't do); stateless visitors go to the selector with ?from=home (it
      //    only auto-hops when from=home + a saved state exist, so this stays
      //    consistent with the server rule).
      if (p === '/' || p === '/index' || p === '/en' || p === '/en/') {
        var saved = null;
        try { saved = localStorage.getItem('xcel-selected-state'); } catch (e) { saved = null; }
        if (saved && STATES.indexOf(saved) !== -1) {
          window.location.replace('/' + saved + '/');
        } else {
          window.location.replace('/state-selector?from=home');
        }
        return;
      }

      // 2) Bare state home: a state home is the folder index at "/{state}/";
      //    the bare "/{state}" resolves to a separate top-level doc that doesn't
      //    exist, so it 404s. Forward the bare form to the canonical
      //    trailing-slash home (server equivalent: redirects-sheet rule
      //    Source "/{state}" -> "/{state}/"). Only an exact single "/{state}"
      //    segment matches — genuine deep 404s (e.g. /tx/does-not-exist) still
      //    show the error page below.
      var segs = p.split('/').filter(Boolean);
      if (segs.length === 1 && STATES.indexOf(segs[0]) !== -1) {
        window.location.replace('/' + segs[0] + '/' + window.location.search + window.location.hash);
        return;
      }
    }());
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <meta name="robots" content="noindex, nofollow">
  <script src="/scripts/scripts.js" type="module"></script>
  <script type="module">
    window.addEventListener('load', () => {
      if (document.referrer) {
        const { origin, pathname } = new URL(document.referrer);
        if (origin === window.location.origin) {
          const backBtn = document.createElement('a');
          backBtn.classList.add('button', 'secondary', 'error-button-back');
          backBtn.href = pathname;
          backBtn.textContent = 'Go back';
          backBtn.title = 'Go back';
          const btnContainer = document.querySelector('.button-container');
          btnContainer.append(backBtn);
        }
      }
    });
  </script>
  <script type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--header-height));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      box-sizing: border-box;
    }

    main.error .section {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      text-align: center;
    }

    main.error .error-code {
      display: block;
      margin: 0;
      font-family: var(--heading-font-family);
      font-weight: 700;
      font-size: clamp(96px, 22vw, 180px);
      line-height: 1;
      letter-spacing: -0.02em;
      background-image: linear-gradient(120deg, var(--link-color), var(--link-hover-color));
      /* stylelint-disable-next-line property-no-vendor-prefix */
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    main.error .error-message {
      margin: 8px 0 0;
      font-size: var(--heading-font-size-l);
      font-weight: 600;
      color: var(--text-color);
    }

    main.error .error-description {
      margin: 16px auto 0;
      max-width: 440px;
      font-size: var(--body-font-size-s);
      color: var(--dark-color);
    }

    main.error .button-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 32px;
    }

    main.error .button-container a.button {
      margin: 0;
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <span class="error-code">404</span>
      <h1 class="error-message">This page took a coffee break</h1>
      <p class="error-description">
        We couldn't find the page you were looking for. It may have moved, or the link
        might be out of date. Let's get you back on track.
      </p>
      <p class="button-container">
        <a href="/" class="button error-button-home">Back to home</a>
      </p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
