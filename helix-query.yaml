# Content is organized as /{state}/{locale}/... (e.g. /tx/en/about-us) — the
# state segment comes BEFORE the locale. Each state/locale gets its own
# query-index so nav, search and feeds stay scoped to the visitor's state and
# language. A global index feeds the sitemap. Keep the state/locale list in sync
# with SITE_STATES/SITE_LOCALES in scripts/scripts.js and the state-selector.
indices:
  # Global index across every state/locale — used by helix-sitemap.yaml.
  all:
    include:
      - /**
    exclude:
      - /snippets/**
      - /**/snippets/**
    target: /query-index.json
    properties: &props
      author:
        select: head > meta[name="author"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      tags:
        select: head > meta[name="keywords"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="published-time"]
        value: attribute(el, "content")
      navOrder:
        select: head > meta[name="nav-order"]
        value: attribute(el, "content")

  # --- Colorado ---
  co-en:
    include:
      - /co/en
      - /co/en/**
    exclude:
      - /co/en/snippets/**
    target: /co/en/query-index.json
    properties: *props
  co-fr:
    include:
      - /co/fr
      - /co/fr/**
    exclude:
      - /co/fr/snippets/**
    target: /co/fr/query-index.json
    properties: *props

