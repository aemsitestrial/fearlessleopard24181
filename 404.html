<!DOCTYPE html>
<html>

<head>
  <title>Page not found</title>
  <script type="text/javascript">
    // Home redirect: there is no root home page — all content lives under
    // /{state}/... So when a visitor hits the site root, send them to their
    // selected state's home, or to the state selector if none is saved yet.
    // The state selector, after a pick with no return param, lands on the
    // state home — so a stateless visitor still ends up on the right home.
    // Runs before the 404 UI renders to avoid a flash. Only the home path is
    // redirected; genuine deep 404s still show the error page below.
    // Keep the STATES list in sync with scripts/constants.js SITE_STATES.
    (function () {
      var p = window.location.pathname;
      if (p === '/' || p === '/index' || p === '/en' || p === '/en/') {
        var STATES = ['co', 'mi', 'mn', 'nm', 'nd', 'sd', 'tx', 'wi'];
        var saved = null;
        try { saved = localStorage.getItem('xcel-selected-state'); } catch (e) { saved = null; }
        if (saved && STATES.indexOf(saved) !== -1) {
          window.location.replace('/' + saved + '/');
        } else {
          window.location.replace('/state-selector');
        }
      }
    }());
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <script src="/scripts/scripts.js" type="module"></script>
  <script type="module">
    window.addEventListener('load', () => {
      if (document.referrer) {
        const { origin, pathname } = new URL(document.referrer);
        if (origin === window.location.origin) {
          const backBtn = document.createElement('a');
          backBtn.classList.add('button', 'error-button-back');
          backBtn.href = pathname;
          backBtn.textContent = 'Go back';
          backBtn.title = 'Go back';
          const btnContainer = document.querySelector('.button-container');
          btnContainer.append(backBtn);
        }
      }
    });
  </script>
  <script type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--header-height));
      display: flex;
      align-items: center;
    }

    main.error .error-number {
      width: 100%;
    }

    main.error .error-number text {
      font-family: var(--fixed-font-family);
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <svg viewBox="1 0 38 18" class="error-number">
        <text x="0" y="17">404</text>
      </svg>
      <h2 class="error-message">Page Not Found</h2>
      <p class="button-container">
        <a href="/" class="button secondary error-button-home">Go home</a>
      </p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
